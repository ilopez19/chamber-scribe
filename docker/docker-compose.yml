# Runs the whole system: MongoDB + the pipeline (scraper/downloader/
# transcriber loops) + the REST API — three separate containers, matching
# how they actually run in production (separate processes that only ever
# talk to each other through MongoDB, never direct RPC — see design.svg).
#
# Usage:
#   cp .env.example .env      # first time only
#   docker compose up --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not exposed to the host on purpose — only the pipeline/api containers
    # need it, and they reach it over the compose network by service name.

  pipeline:
    build: .
    command: ["python", "main.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever's in .env — inside compose, Mongo is reachable
      # by service name, not localhost.
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    volumes:
      # Downloaded audio/captions survive container restarts and are
      # visible to the api container too (transcripts reference these
      # paths, though the API itself doesn't serve the files directly).
      - storage:/app/storage

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    healthcheck:
      # /health reports on this container AND the pipeline container,
      # since both only ever coordinate through Mongo heartbeats.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  storage:
