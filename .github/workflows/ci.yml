# CI: run the test suite on every push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.txt pulls in requirements.txt too. torch is
      # intentionally not installed here (see requirements.txt) — the unit
      # tests exercise pure logic, not real models, and conftest.py stubs
      # torch/faster_whisper's model classes so importing app code doesn't
      # require either a real model download or a GPU.
      - run: pip install -r requirements-dev.txt

      - run: pytest
