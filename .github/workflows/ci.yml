# CI: run the test suite on every push/PR, then build the Docker image to
# confirm it still builds cleanly. On a push to main (not on PRs, so a fork
# or feature-branch PR can't push under this repo's name), the image is
# also pushed to GHCR so main always has a ready-to-pull image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual only (Actions tab -> CI -> Run workflow) — there's no push/PR
  # trigger for deploy since there's no live cluster to auto-deploy to
  # yet. See the "deploy" job below and the README's "Deploying via
  # GitHub Actions" section.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (must already exist in GHCR)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.txt pulls in requirements.txt too. torch is
      # intentionally not installed here (see requirements.txt) — the unit
      # tests exercise pure logic, not real models, and conftest.py stubs
      # torch/faster_whisper's model classes so importing app code doesn't
      # require either a real model download or a GPU.
      - run: pip install -r requirements-dev.txt

      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR wants a lowercase image path; github.repository preserves
      # whatever case the repo name actually has.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds on every push/PR (catches a broken Dockerfile early); only
      # pushes to GHCR on push to main, per the job comment above.
      - name: Build image (push on main only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys an already-built image (from a prior push to main) to whatever
  # cluster the KUBECONFIG secret points at. Manual-only (see
  # workflow_dispatch above) — not wired to any real cluster yet. To use
  # this for real: add a KUBECONFIG repo secret (Settings -> Secrets and
  # variables -> Actions), base64 of a working kubeconfig for your
  # cluster, e.g. `cat ~/.kube/config | base64 -w0`. Until that secret
  # exists, the "Verify KUBECONFIG secret is set" step below fails with a
  # clear message instead of a confusing helm connection error.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Verify KUBECONFIG secret is set
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::error::KUBECONFIG secret is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow. See README's 'Deploying via GitHub Actions' section."
            exit 1
          fi

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy with Helm
        run: |
          helm upgrade --install chamber-scribe helm/chamber-scribe \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ inputs.image_tag }}
