<svg viewBox="0 0 1020 1160" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    svg { background: #eef1f6; }
    .eyebrow { fill: #2563eb; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    .title { fill: #0f172a; font-size: 30px; font-weight: 800; }
    .subtitle { fill: #475569; font-size: 14px; }
    .badgebg { fill: #ffffff; stroke: #d8dee8; stroke-width: 1; }
    .badgetext { fill: #0f172a; font-size: 12px; font-weight: 600; }
    .dot { fill: #22c55e; }

    .pillstart { fill: #dde3ec; stroke: #b9c3d4; stroke-width: 1.5; }
    .pillend { fill: #d6f3df; stroke: #86d9a0; stroke-width: 1.5; }
    .pilltext { fill: #0f172a; font-size: 16px; font-weight: 700; }
    .pilltextend { fill: #14532d; font-size: 16px; font-weight: 700; }

    .stepbox { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.5; }
    .steptitle { fill: #0f172a; font-size: 17px; font-weight: 700; }
    .stepdesc { fill: #475569; font-size: 13px; }

    .diamond { fill: #cfe3fb; stroke: #7ab2ea; stroke-width: 1.5; }
    .diamondtext { fill: #0f2c4d; font-size: 14px; font-weight: 700; }

    .excludedbox { fill: #fbf1e3; stroke: #d9a35c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .excludedtitle { fill: #8a4b12; font-size: 15px; font-weight: 700; }
    .excludeddesc { fill: #6b5236; font-size: 12px; }

    .retriedbox { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.5; }
    .retriedtitle { fill: #b5460e; font-size: 15px; font-weight: 700; }
    .retrieddesc { fill: #475569; font-size: 12px; }

    .failedbox { fill: #fbe1e1; stroke: #e08585; stroke-width: 1.5; }
    .failedtitle { fill: #9c1f1f; font-size: 15px; font-weight: 700; }
    .faileddesc { fill: #7a3a3a; font-size: 12px; }

    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; }
    .arrowlabel { fill: #334155; font-size: 12px; font-weight: 700; }
    .retryarrow { stroke: #d92626; stroke-width: 2.5; fill: none; }
    .retryarrowlabel { fill: #b91c1c; font-size: 12px; font-weight: 700; }

    .healthline { stroke: #c9862a; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .healthlabel { fill: #a5620f; font-size: 12px; font-weight: 700; }

    .legendtext { fill: #334155; font-size: 13px; }
    .footer { fill: #64748b; font-size: 13px; }
    .hr { stroke: #d8dee8; stroke-width: 1; }

    @media (prefers-color-scheme: dark) {
      svg { background: #0f172a; }
      .eyebrow { fill: #60a5fa; }
      .title { fill: #f1f5f9; }
      .subtitle { fill: #cbd5e1; }
      .badgebg { fill: #1e293b; stroke: #475569; }
      .badgetext { fill: #f1f5f9; }

      .pillstart { fill: #263042; stroke: #64748b; }
      .pillend { fill: #113a22; stroke: #3f9d5f; }
      .pilltext { fill: #f1f5f9; }
      .pilltextend { fill: #bdf3cf; }

      .stepbox { fill: #1e293b; stroke: #475569; }
      .steptitle { fill: #f1f5f9; }
      .stepdesc { fill: #cbd5e1; }

      .diamond { fill: #1d3f63; stroke: #5b9bdc; }
      .diamondtext { fill: #eaf2fb; }

      .excludedbox { fill: #3a2c14; stroke: #c9862a; }
      .excludedtitle { fill: #f0b866; }
      .excludeddesc { fill: #d9c9a8; }

      .retriedbox { fill: #1e293b; stroke: #475569; }
      .retriedtitle { fill: #ff9955; }
      .retrieddesc { fill: #cbd5e1; }

      .failedbox { fill: #3d1a1a; stroke: #b04242; }
      .failedtitle { fill: #ff8080; }
      .faileddesc { fill: #e3b9b9; }

      .arrow { stroke: #94a3b8; }
      .arrowlabel { fill: #cbd5e1; }
      .retryarrow { stroke: #ff6b6b; }
      .retryarrowlabel { fill: #ff8f8f; }

      .healthline { stroke: #f0b866; }
      .healthlabel { fill: #f0b866; }

      .legendtext { fill: #cbd5e1; }
      .footer { fill: #94a3b8; }
      .hr { stroke: #334155; }
    }
  </style>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow" style="fill: context-stroke;"/>
    </marker>
    <marker id="retryHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="retryarrow" style="fill: context-stroke;"/>
    </marker>
  </defs>

  <!-- ===================== header ===================== -->
  <text x="40" y="42" class="eyebrow">WORKFLOW</text>
  <text x="40" y="80" class="title">Chamber Scribe: hearing video &#8594; transcript</text>
  <text x="40" y="108" class="subtitle">Every job moves through the same automated path, with built-in decision points for jobs that don't need</text>
  <text x="40" y="128" class="subtitle">transcribing and jobs that fail.</text>

  <rect x="790" y="18" width="190" height="46" rx="10" class="badgebg"/>
  <circle cx="812" cy="35" r="5" class="dot"/>
  <text x="826" y="33" class="badgetext">Runs 24/7,</text>
  <text x="826" y="51" class="badgetext">unattended</text>

  <!-- ===================== health monitoring side-path ===================== -->
  <text x="20" y="248" class="healthlabel">Health check every cycle</text>
  <line x1="90" y1="260" x2="90" y2="955" class="healthline"/>
  <line x1="90" y1="295" x2="250" y2="295" class="healthline"/>
  <line x1="90" y1="532" x2="250" y2="532" class="healthline"/>
  <line x1="90" y1="645" x2="250" y2="645" class="healthline"/>
  <line x1="90" y1="887" x2="250" y2="887" class="healthline"/>
  <text x="20" y="978" class="healthlabel">Auto-restarts if it crashes</text>

  <!-- ===================== main flow arrows ===================== -->
  <line x1="420" y1="225" x2="420" y2="248" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="340" x2="420" y2="358" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="462" x2="420" y2="488" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="575" x2="420" y2="598" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="690" x2="420" y2="710" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="820" x2="420" y2="843" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="420" y1="930" x2="420" y2="953" class="arrow" marker-end="url(#arrowHead)"/>

  <!-- decision branch: worth transcribing? -> No -> Excluded -->
  <line x1="490" y1="410" x2="698" y2="410" class="arrow" marker-end="url(#arrowHead)"/>
  <text x="560" y="402" class="arrowlabel">No</text>
  <text x="434" y="480" class="arrowlabel">Yes</text>

  <!-- decision branch: succeeded? -> No -> Retried automatically -> Failed -->
  <line x1="490" y1="765" x2="698" y2="765" class="retryarrow" marker-end="url(#retryHead)"/>
  <text x="560" y="757" class="retryarrowlabel">No</text>
  <text x="434" y="835" class="arrowlabel">Yes</text>
  <line x1="838" y1="832" x2="838" y2="848" class="retryarrow" marker-end="url(#retryHead)"/>

  <!-- ===================== nodes ===================== -->

  <!-- Start -->
  <rect x="270" y="170" width="300" height="55" rx="27" class="pillstart"/>
  <text x="420" y="203" text-anchor="middle" class="pilltext">New hearing video posted</text>

  <!-- 1. Scrape -->
  <rect x="250" y="250" width="340" height="90" rx="10" class="stepbox"/>
  <text x="272" y="280" class="steptitle">1. Scrape</text>
  <text x="272" y="303" class="stepdesc">Finds every new video on the Senate &amp; House</text>
  <text x="272" y="321" class="stepdesc">portals, every 60 minutes.</text>

  <!-- Worth transcribing? -->
  <polygon points="420,358 495,410 420,462 345,410" class="diamond"/>
  <text x="420" y="405" text-anchor="middle" class="diamondtext">Worth</text>
  <text x="420" y="421" text-anchor="middle" class="diamondtext">transcribing?</text>

  <!-- Excluded -->
  <rect x="700" y="378" width="280" height="100" rx="10" class="excludedbox"/>
  <text x="722" y="405" class="excludedtitle">Excluded</text>
  <text x="722" y="426" class="excludeddesc">Deliberate business rule (too short,</text>
  <text x="722" y="443" class="excludeddesc">no stable recording) &#8212; not an</text>
  <text x="722" y="460" class="excludeddesc">error, never retried.</text>

  <!-- 2. Download -->
  <rect x="250" y="488" width="340" height="85" rx="10" class="stepbox"/>
  <text x="272" y="518" class="steptitle">2. Download</text>
  <text x="272" y="541" class="stepdesc">Pulls audio only, claiming jobs so nothing is</text>
  <text x="272" y="559" class="stepdesc">processed twice.</text>

  <!-- 3. Transcribe -->
  <rect x="250" y="598" width="340" height="90" rx="10" class="stepbox"/>
  <text x="272" y="628" class="steptitle">3. Transcribe</text>
  <text x="272" y="651" class="stepdesc">Instant from existing captions, or AI</text>
  <text x="272" y="669" class="stepdesc">transcription (Whisper) otherwise.</text>

  <!-- Succeeded? -->
  <polygon points="420,710 495,765 420,820 345,765" class="diamond"/>
  <text x="420" y="769" text-anchor="middle" class="diamondtext">Succeeded?</text>

  <!-- Retried automatically -->
  <rect x="700" y="728" width="280" height="104" rx="10" class="retriedbox"/>
  <text x="722" y="755" class="retriedtitle">Retried automatically</text>
  <text x="722" y="776" class="retrieddesc">Genuine failure (network, engine</text>
  <text x="722" y="793" class="retrieddesc">crash) &#8212; retries up to 3 times</text>
  <text x="722" y="810" class="retrieddesc">before it's flagged.</text>

  <!-- Failed - needs review -->
  <rect x="700" y="848" width="280" height="80" rx="10" class="failedbox"/>
  <text x="722" y="874" class="failedtitle">Failed &#8212; needs review</text>
  <text x="722" y="895" class="faileddesc">Only surfaces here after retries</text>
  <text x="722" y="912" class="faileddesc">are exhausted.</text>

  <!-- 4. Publish -->
  <rect x="250" y="843" width="340" height="85" rx="10" class="stepbox"/>
  <text x="272" y="873" class="steptitle">4. Publish</text>
  <text x="272" y="896" class="stepdesc">Transcript is stored and made available on</text>
  <text x="272" y="914" class="stepdesc">demand via the API.</text>

  <!-- End -->
  <rect x="255" y="953" width="330" height="55" rx="27" class="pillend"/>
  <text x="420" y="986" text-anchor="middle" class="pilltextend">Transcript live via REST API</text>

  <!-- ===================== legend ===================== -->
  <rect x="20" y="1040" width="16" height="16" fill="#64748b"/>
  <text x="42" y="1053" class="legendtext">Main pipeline step</text>
  <rect x="215" y="1040" width="16" height="16" fill="#7ab2ea"/>
  <text x="237" y="1053" class="legendtext">Decision point</text>
  <rect x="385" y="1040" width="16" height="16" fill="#c9862a"/>
  <text x="407" y="1053" class="legendtext">Health monitoring</text>
  <rect x="575" y="1040" width="16" height="16" fill="#d92626"/>
  <text x="597" y="1053" class="legendtext">Retry / failure path</text>

  <!-- ===================== footer ===================== -->
  <line x1="20" y1="1090" x2="1000" y2="1090" class="hr"/>
  <text x="20" y="1122" class="footer">The pipeline and the API run as two independent processes, so one is never blocked by the other.</text>

</svg>
